[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "churn-prediction-ml-platform"
version = "0.1.0"
description = "Plataforma ML end-to-end para previsão de churn em arquitetura multi-tenant"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=ml --cov=src --cov-report=term-missing --cov-report=html:htmlcov"
markers = [
    "smoke: testes de fumaça — fluxo mínimo end-to-end sem dependências externas",
    "schema: testes de estrutura — valida colunas, tipos e configuração de features",
    "api: testes de contrato da API — valida estrutura do JSON de resposta",
    "integration: testes de integração — requerem PostgreSQL (churn_test) em execução",
]

[tool.coverage.run]
source = ["ml", "scripts", "src"]
omit = [".venv/*", "tests/*", "notebooks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # linha longa — coberta pelo line-length
    "B008",  # do not perform function calls in default arguments (FastAPI usa isso)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E712"]
"notebooks/*" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
